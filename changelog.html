  <script>
    // ---- Config ----
    var R2_BASE = 'https://download.mpe.run';
    var CHANGELOG_URL = R2_BASE + '/changelog.json';

    // ---- Render a release card ----
    function renderRelease(release) {
      var notes = release.notes || 'No release notes available.';
      var date = release.date || '';
      var version = release.tag || release.version || 'v?.?.?';
      var isPrerelease = release.prerelease;
      var downloads = release.downloads || {};

      // Format date
      if (date && date.indexOf('T') !== -1) {
        try { date = new Date(date).toISOString().split('T')[0]; } catch (e) { /* keep original */ }
      }

      var html = '<div class="release-card">';
      html += '<div class="release-header">';
      html += '<span class="release-version">' + escapeHtml(version) + '</span>';
      if (isPrerelease) {
        html += '<span class="release-badge prerelease">Pre-release</span>';
      }
      if (date) {
        html += '<span class="release-date">' + date + '</span>';
      }
      html += '</div>';
      html += '<div class="release-notes">' + escapeHtml(notes) + '</div>';
      if (downloads.windows || downloads.macos || downloads.linux) {
        html += '<div class="release-downloads">';
        if (downloads.windows) {
          html += '<a href="' + downloads.windows + '" class="btn btn-sm" download>Windows</a>';
        }
        if (downloads.macos) {
          html += '<a href="' + downloads.macos + '" class="btn btn-sm" download>macOS</a>';
        }
        if (downloads.linux) {
          html += '<a href="' + downloads.linux + '" class="btn btn-sm" download>Linux CLI</a>';
        }
        html += '</div>';
      }
      html += '</div>';
      return html;
    }

    // ---- Simple HTML escaping ----
    function escapeHtml(str) {
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }

    // ---- Main ----
    (function init() {
      var statusEl = document.getElementById('cl-status');
      var listEl = document.getElementById('release-list');

      fetch(CHANGELOG_URL)
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (releases) {
          if (!Array.isArray(releases) || releases.length === 0) {
            listEl.innerHTML = '<div class="error-state"><h2>No releases found</h2></div>';
          } else {
            // Deduplicate: keep only the latest entry for each version
            var seen = {};
            var uniqueReleases = [];
            for (var i = 0; i < releases.length; i++) {
              var key = releases[i].tag || releases[i].version;
              if (key && !seen[key]) {
                seen[key] = true;
                uniqueReleases.push(releases[i]);
              }
            }

            var html = '';
            for (var i = 0; i < uniqueReleases.length; i++) {
              html += renderRelease(uniqueReleases[i]);
            }
            listEl.innerHTML = html;
          }
          statusEl.style.display = 'none';
          listEl.style.display = '';
        })
        .catch(function (err) {
          statusEl.className = 'download-status error';
          statusEl.innerHTML = '<h2>Could not load release history</h2><p>Unable to reach the release server. Please try again later.</p>';
        });
    })();

    // ---- Footer year ----
    document.getElementById('footer-year').textContent = new Date().getFullYear();
  </script>
