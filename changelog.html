<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Changelog &mdash; Multi-Protocol Flow Executor</title>
  <meta name="description" content="Release notes and version history for Multi-Protocol Flow Executor.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <a href="/" class="logo">
        <img src="mpe-logo.svg" alt="MPE Flow" class="logo-img">
      </a>
      <nav aria-label="Main navigation">
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="download.html">Download</a></li>
          <li><a href="changelog.html" class="active">Changelog</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Changelog Content -->
  <section class="changelog-page">
    <div class="container">
      <h1>Changelog</h1>

      <div id="cl-status" class="download-status">
        <div class="spinner"></div>
        <p>Loading release history...</p>
      </div>

      <div id="release-list" class="release-list" style="display:none;">
        <!-- populated by JavaScript -->
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="footer-year">2026</span> MPE Flow. MIT License.</p>
      <ul class="footer-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="download.html">Download</a></li>
      </ul>
    </div>
  </footer>

  <script>
    // ---- Config ----
    var GITHUB_API = 'https://api.github.com/repos/multi-protocol-flow/multi-protocol-flow-executor/releases';
    var R2_BASE = 'https://mpe-downloads.sunanzhi.com';
    var DOWNLOAD_URL_WIN = R2_BASE + '/releases/{VERSION}/mpe-{VERSION}-x64-setup.exe';
    var DOWNLOAD_URL_MAC = R2_BASE + '/releases/{VERSION}/mpe-{VERSION}-universal.dmg';

    // ---- Render a release card ----
    function renderRelease(release) {
      var notes = release.body || 'No release notes available.';
      var date = release.published_at || '';
      var version = release.tag_name || 'v?.?.?';
      var isPrerelease = release.prerelease;

      // Format date
      if (date && date.indexOf('T') !== -1) {
        try { date = new Date(date).toISOString().split('T')[0]; } catch (e) { /* keep original */ }
      }

      // Build download links
      var ver = version.replace(/^v/, '');
      var winUrl = DOWNLOAD_URL_WIN.replace(/\{VERSION\}/g, ver);
      var macUrl = DOWNLOAD_URL_MAC.replace(/\{VERSION\}/g, ver);

      var html = '<div class="release-card">';
      html += '<div class="release-header">';
      html += '<span class="release-version">' + escapeHtml(version) + '</span>';
      if (isPrerelease) {
        html += '<span class="release-badge prerelease">Pre-release</span>';
      }
      if (date) {
        html += '<span class="release-date">' + date + '</span>';
      }
      html += '</div>';
      html += '<div class="release-notes">' + escapeHtml(notes) + '</div>';
      html += '<div class="release-downloads">';
      html += '<a href="' + winUrl + '" class="btn btn-sm" download>Windows</a>';
      html += '<a href="' + macUrl + '" class="btn btn-sm" download>macOS</a>';
      html += '</div>';
      html += '</div>';
      return html;
    }

    // ---- Simple HTML escaping ----
    function escapeHtml(str) {
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }

    // ---- Main ----
    (function init() {
      var statusEl = document.getElementById('cl-status');
      var listEl = document.getElementById('release-list');

      fetch(GITHUB_API + '?per_page=20')
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (releases) {
          if (!Array.isArray(releases) || releases.length === 0) {
            listEl.innerHTML = '<div class="error-state"><h2>No releases found</h2></div>';
          } else {
            var html = '';
            for (var i = 0; i < releases.length; i++) {
              html += renderRelease(releases[i]);
            }
            listEl.innerHTML = html;
          }
          statusEl.style.display = 'none';
          listEl.style.display = '';
        })
        .catch(function (err) {
          statusEl.className = 'download-status error';
          statusEl.innerHTML = '<h2>Could not load release history</h2><p>Unable to reach GitHub. Please try again later.</p>';
        });
    })();

    // ---- Footer year ----
    document.getElementById('footer-year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
